services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: greenquote
      POSTGRES_PASSWORD: greenquote
      POSTGRES_DB: greenquote
    ports:
      - '5432:5432'
    volumes:
      - greenquote-dev-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenquote -d greenquote']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  greenquote-dev-pgdata:
